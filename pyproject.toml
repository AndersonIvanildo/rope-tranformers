requires-python = ">=3.11.5,<3.12"
dependencies = [
    "numpy==2.4.6",
    "plotly==7.0.0",
    "streamlit==1.66.1",
]

[dependency-groups]
notebook = ["jupyterlab>=4,<5", "nbformat>=5,<6", "nbclient>=0.10,<1"]

[tool.uv]
package = false
